<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAX 翻譯機 | SQL to DAX AI Assistant</title>
    <!-- 使用 Tailwind CSS 建立專業的 UI 佈局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .textarea-code { font-family: 'Consolas', 'Monaco', monospace; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-code"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900">DAX 翻譯機 <span class="text-sm font-normal text-gray-500 ml-2">SQL 轉 DAX AI 小幫手</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <input type="password" id="apiKeyInput" placeholder="輸入 Gemini API Key" 
                    class="text-sm border border-gray-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 w-64"
                    title="API Key 僅儲存於本地端瀏覽器">
            </div>
        </div>
    </header>

    <!-- 主要內容區 (雙欄佈局) -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- 左欄：SQL 輸入區 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[calc(100vh-140px)]">
            <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 class="font-semibold text-gray-700"><i class="fa-solid fa-database text-blue-500 mr-2"></i>輸入 SQL 語法</h2>
                <button onclick="clearInput()" class="text-sm text-gray-500 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-eraser mr-1"></i>清空
                </button>
            </div>
            <div class="flex-grow p-4">
                <textarea id="sqlInput" class="textarea-code w-full h-full resize-none focus:outline-none focus:ring-0 text-sm" 
                    placeholder="在此貼上您的 SQL 查詢語句...&#10;&#10;例如：&#10;SELECT &#10;  Department,&#10;  SUM(SalesAmount) AS TotalSales&#10;FROM SalesData&#10;WHERE Year = 2023&#10;GROUP BY Department;"></textarea>
            </div>
            <div class="p-4 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-end">
                <button id="translateBtn" onclick="translateToDax()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-all shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 一鍵生成 DAX
                </button>
            </div>
        </div>

        <!-- 右欄：DAX 輸出區 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[calc(100vh-140px)] relative">
            
            <!-- 載入動畫 (預設隱藏) -->
            <div id="loadingOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 hidden flex-col justify-center items-center rounded-xl">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-4xl mb-3"></i>
                <p class="text-gray-600 font-medium">AI 正在解析並轉換語法...</p>
            </div>

            <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 class="font-semibold text-gray-700"><i class="fa-solid fa-chart-line text-green-500 mr-2"></i>生成 DAX 語法</h2>
                <button onclick="copyDax()" class="text-sm text-blue-600 hover:text-blue-800 transition-colors font-medium">
                    <i class="fa-regular fa-copy mr-1"></i>複製程式碼
                </button>
            </div>
            <div class="flex-grow p-4 bg-gray-900 text-gray-100 rounded-b-xl overflow-hidden relative">
                <textarea id="daxOutput" readonly class="textarea-code w-full h-full resize-none focus:outline-none bg-transparent text-sm text-green-400" 
                    placeholder="AI 生成的 DAX 語法將顯示於此..."></textarea>
            </div>
        </div>
    </main>

    <script>
        // 取得 DOM 元素
        const sqlInput = document.getElementById('sqlInput');
        const daxOutput = document.getElementById('daxOutput');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const translateBtn = document.getElementById('translateBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // 頁面載入時嘗試從 localStorage 讀取 API Key
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) apiKeyInput.value = savedKey;
        });

        // 儲存 API Key 當輸入改變時
        apiKeyInput.addEventListener('change', (e) => {
            localStorage.setItem('gemini_api_key', e.target.value);
        });

        // 清空輸入
        function clearInput() {
            sqlInput.value = '';
            daxOutput.value = '';
        }

        // 複製到剪貼簿
        function copyDax() {
            if (!daxOutput.value) return;
            navigator.clipboard.writeText(daxOutput.value).then(() => {
                alert('DAX 語法已複製到剪貼簿！');
            }).catch(err => {
                console.error('複製失敗:', err);
            });
        }

        // 呼叫 Gemini API 進行翻譯
        async function translateToDax() {
            const sql = sqlInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!sql) {
                alert('請先輸入 SQL 語法！');
                return;
            }
            
            if (!apiKey) {
                alert('請在右上方輸入您的 Gemini API Key！\n您可以在 Google AI Studio 免費取得。');
                return;
            }

            // 嚴謹的系統提示詞：確保資料表與欄位名稱對齊
            const promptText = `
你是一位精通 SQL 與 Power BI DAX 的資深資料工程師。請將以下 SQL 查詢轉換為最精簡、效能最佳的 DAX 語法。

【嚴格遵守規則】：
1. 維持一致性：產出的 DAX 必須與 SQL 中的「資料表名稱 (Table Name)」與「欄位名稱 (Column Name)」完全一模一樣，絕對不可自行修改或發明名稱。
2. 輸出格式：只能輸出 DAX 程式碼純文字，絕對「不要」包含 Markdown 語法 (如 \`\`\`dax)、不要包含任何解說文字。
3. 若 SQL 包含 GROUP BY 或聚合函數 (SUM, COUNT)，請優先轉換為 SUMMARIZE 或 ADDCOLUMNS 結合 CALCULATE 的結構。

【輸入 SQL】：
${sql}
`;

            // 顯示載入動畫
            loadingOverlay.classList.remove('hidden');
            translateBtn.disabled = true;
            daxOutput.value = '';

            try {
                // 呼叫 Gemini 1.5 Flash 模型
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: promptText }]
                        }],
                        generationConfig: {
                            temperature: 0.1, // 低溫度以確保產出穩定精準的程式碼
                            topK: 1,
                            topP: 1
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 請求失敗: ${response.status}`);
                }

                const data = await response.json();
                
                // 解析回傳的文字並過濾可能殘留的 markdown 標記
                let generatedText = data.candidates[0].content.parts[0].text;
                generatedText = generatedText.replace(/```dax/gi, '').replace(/```/g, '').trim();
                
                daxOutput.value = generatedText;

            } catch (error) {
                console.error(error);
                daxOutput.value = `發生錯誤，請檢查您的 API Key 或是網路連線。\n\n錯誤訊息：${error.message}`;
            } finally {
                // 隱藏載入動畫
                loadingOverlay.classList.add('hidden');
                translateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
