<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAX Function Explorer Pro</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#f4f7fb}header{background:#1e40af;color:#fff;padding:16px 24px;position:sticky;top:0}#search{width:100%;padding:12px;border:none;border-radius:10px;margin-top:10px}.layout{display:flex;height:calc(100vh - 92px)}aside{width:260px;background:#fff;border-right:1px solid #ddd;overflow:auto}.cat{padding:12px 16px;cursor:pointer}.cat:hover,.active{background:#dbeafe;color:#1e40af;font-weight:700}main{flex:1;padding:20px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}.tag{display:inline-block;background:#e0f2fe;padding:3px 8px;border-radius:20px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}.box{background:#fff;width:900px;max-width:95%;margin:40px auto;padding:24px;border-radius:18px}pre{background:#0f172a;color:#fff;padding:12px;border-radius:8px;overflow:auto}button{background:#2563eb;color:#fff;border:none;padding:10px 16px;border-radius:8px}</style></head><body><header><h2>🚀 DAX Function Explorer Pro</h2><input id="search" placeholder="搜尋函數名稱、用途、關鍵字..."/></header><div class="layout"><aside id="cats"></aside><main><div id="count"></div><div id="grid" class="grid"></div></main></div><div class="modal" id="modal"><div class="box"><h2 id="fn"></h2><p><b>分類：</b><span id="fc"></span></p><p id="fd"></p><h3>語法</h3><pre id="fs"></pre><h3>範例</h3><pre id="fe"></pre><p><a id="fl" target="_blank">Microsoft Learn 文件</a></p><button onclick="closeModal()">關閉</button></div></div><script>const data=[{n:'SUM',c:'聚合函數',d:'將資料行中的所有數值加總',s:'SUM(<column>)',e:'Total Sales = SUM(Sales[Amount])',u:'https://learn.microsoft.com/zh-tw/dax/sum-function-dax'},{n:'SUMX',c:'聚合函數',d:'逐列計算後加總',s:'SUMX(<table>,<expression>)',e:'SUMX(Sales,Sales[Qty]*Sales[Price])',u:'#'},{n:'AVERAGE',c:'聚合函數',d:'平均值',s:'AVERAGE(<column>)',e:'AVERAGE(Sales[Amount])',u:'#'},{n:'COUNTROWS',c:'聚合函數',d:'計算資料列數',s:'COUNTROWS(<table>)',e:'COUNTROWS(Customer)',u:'#'},{n:'DATE',c:'日期時間',d:'建立日期',s:'DATE(y,m,d)',e:'DATE(2026,1,1)',u:'#'},{n:'TODAY',c:'日期時間',d:'今日日期',s:'TODAY()',e:'TODAY()',u:'#'},{n:'DATEDIFF',c:'日期時間',d:'計算日期差異',s:'DATEDIFF(a,b,DAY)',e:'DATEDIFF([Start],[End],DAY)',u:'#'},{n:'CALCULATE',c:'篩選函數',d:'修改 Filter Context',s:'CALCULATE(expression,filter)',e:'CALCULATE([Sales],Product[Type]="A")',u:'https://learn.microsoft.com/zh-tw/dax/calculate-function-dax'},{n:'FILTER',c:'篩選函數',d:'回傳篩選資料表',s:'FILTER(table,condition)',e:'FILTER(Sales,Sales[Amount]>1000)',u:'#'},{n:'ALL',c:'篩選函數',d:'移除篩選',s:'ALL(table)',e:'CALCULATE([Sales],ALL(Product))',u:'#'},{n:'IF',c:'邏輯函數',d:'條件判斷',s:'IF(test,a,b)',e:'IF([Sales]>0,"Y","N")',u:'#'},{n:'SWITCH',c:'邏輯函數',d:'多條件判斷',s:'SWITCH(expr,val,res)',e:'SWITCH(TRUE(),[Sales]>100,"A")',u:'#'},{n:'RANKX',c:'統計函數',d:'排名',s:'RANKX(table,expr)',e:'RANKX(ALL(Customer),[Sales])',u:'#'},{n:'MEDIAN',c:'統計函數',d:'中位數',s:'MEDIAN(column)',e:'MEDIAN(Sales[Amount])',u:'#'},{n:'RELATED',c:'關聯性函式',d:'取得關聯值',s:'RELATED(column)',e:'RELATED(Product[Name])',u:'#'},{n:'USERELATIONSHIP',c:'關聯性函式',d:'啟用關聯',s:'USERELATIONSHIP(a,b)',e:'CALCULATE([Sales],USERELATIONSHIP(...))',u:'#'},{n:'CONCATENATE',c:'文字函式',d:'字串串接',s:'CONCATENATE(a,b)',e:'CONCATENATE("A","B")',u:'#'},{n:'LEFT',c:'文字函式',d:'取得左側字元',s:'LEFT(text,num)',e:'LEFT("PowerBI",5)',u:'#'},{n:'DATEADD',c:'時間智慧',d:'時間位移',s:'DATEADD(date,-1,YEAR)',e:'DATEADD(Calendar[Date],-1,YEAR)',u:'#'},{n:'TOTALYTD',c:'時間智慧',d:'YTD計算',s:'TOTALYTD(expr,date)',e:'TOTALYTD([Sales],Calendar[Date])',u:'#'},{n:'LOOKUP',c:'最近新增',d:'Visual Calculation查詢',s:'LOOKUP()',e:'LOOKUP()',u:'#'},{n:'LOOKUPWITHTOTALS',c:'最近新增',d:'Visual Calculation查詢含總計',s:'LOOKUPWITHTOTALS()',e:'LOOKUPWITHTOTALS()',u:'#'},{n:'RANK',c:'最近新增',d:'Visual Calculation排名',s:'RANK()',e:'RANK()',u:'#'}];const cats=['全部',...new Set(data.map(x=>x.c))];let current='全部';catsEl=document.getElementById('cats');cats.forEach((c,i)=>{let d=document.createElement('div');d.className='cat'+(i==0?' active':'');d.innerText=c;d.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));d.classList.add('active');current=c;render();};catsEl.appendChild(d);});function render(){let q=search.value.toLowerCase();let rows=data.filter(x=>(current==='全部'||x.c===current)&&(x.n+x.d+x.c).toLowerCase().includes(q));count.innerHTML='<h3>共 '+rows.length+' 筆函數</h3>';grid.innerHTML=rows.map(x=>`<div class=card><div class=tag>${x.c}</div><h3>${x.n}</h3><div>${x.d}</div></div>`).join('');document.querySelectorAll('.card').forEach((c,i)=>c.onclick=()=>open(rows[i]));}function open(x){fn.innerText=x.n;fc.innerText=x.c;fd.innerText=x.d;fs.textContent=x.s;fe.textContent=x.e;fl.href=x.u;modal.style.display='block';}function closeModal(){modal.style.display='none';}search.oninput=render;render();</script></body></html>
