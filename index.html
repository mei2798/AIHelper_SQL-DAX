<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【Vicky * AI】 雙向實時 HTML 編輯器</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    height:100%;
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
}

body{
    display:flex;
    flex-direction:column;
}

header{
    height:60px;
    background:#1976d2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:10px;
    gap:10px;
}

.pane{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    overflow:hidden;
}

.pane-title{
    background:#eeeeee;
    padding:10px;
    font-weight:bold;
    border-bottom:1px solid #ccc;
}

#htmlInput{
    flex:1;
    border:none;
    resize:none;
    padding:12px;
    font-size:15px;
    font-family:Consolas,monospace;
    outline:none;
}

#visualPreview{
    flex:1;
    padding:12px;
    overflow:auto;
    outline:none;
    background:white;
}

#visualPreview:empty::before{
    content:"結果會顯示在這裡，可直接編輯...";
    color:#999;
}
</style>

</head>

<body>

<header>
🛠️ 【Vicky * AI】 雙向實時 HTML 編輯器
</header>

<div class="container">

    <div class="pane">
        <div class="pane-title">
            HTML 原始碼編輯區
        </div>

        <textarea
            id="htmlInput"
            placeholder="請輸入 HTML..."
        ></textarea>

    </div>

    <div class="pane">

        <div class="pane-title">
            結果預覽與可編輯區
        </div>

        <div
            id="visualPreview"
            contenteditable="true"
        ></div>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

    const htmlInput=document.getElementById("htmlInput");
    const visualPreview=document.getElementById("visualPreview");

    let syncing=false;

    function updatePreview(){
        if(syncing)return;
        syncing=true;
        visualPreview.innerHTML=htmlInput.value;
        syncing=false;
    }

    function updateSource(){
        if(syncing)return;
        syncing=true;
        htmlInput.value=visualPreview.innerHTML;
        syncing=false;
    }

    htmlInput.addEventListener("input",updatePreview);

    visualPreview.addEventListener("input",updateSource);

    // 初始內容
    htmlInput.value="";
    visualPreview.innerHTML="";

});

</script>

</body>
</html>
